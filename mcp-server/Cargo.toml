[package]
name = "clinical-document-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clinical-document-parser = { version = "0.1.0", path = ".." }
rmcp = { version = "3.12.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
