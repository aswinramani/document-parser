name: Python Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 5'

jobs:
  analyze:
    if: |
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'feat/') ||
      startsWith(github.head_ref, 'fix/') ||
      startsWith(github.head_ref, 'chore/') ||
      startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      matrix:
        language: [ 'python' ]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python -r scripts/requirements.txt ruff
      - name: Verify and Lint Using Ruff
        run: |
          .venv/bin/python -m py_compile scripts/generate_samples.py
          .venv/bin/ruff check scripts/
      - uses: github/codeql-action/analyze@v4.39.0
        env:
          CODEQL_ACTION_DISABLE_RESULT_CACHING: "true"
