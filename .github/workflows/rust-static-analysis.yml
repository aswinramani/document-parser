name: Rust Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 5'

jobs:
  analyze:
    if: |
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'feat/') ||
      startsWith(github.head_ref, 'fix/') ||
      startsWith(github.head_ref, 'chore/') ||
      startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      matrix:
        language: [ 'rust' ]

    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}
      - name: Verify Compilation and Lint Using Clippy
        run: |
          cargo clippy
      - uses: github/codeql-action/analyze@v4.39.0
        env:
          CODEQL_ACTION_DISABLE_RESULT_CACHING: "true"